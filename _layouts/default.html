<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} &#8212; Access Lab</title>

  <!--
    FOUC prevention: must be the first script in <head>, before any stylesheet.
    Reads the stored theme preference and applies it before CSS loads so
    dark-mode users never see a flash of the light theme.
  -->
  <script>const t=localStorage.getItem('dx-theme');document.documentElement.setAttribute('data-theme',t||'light');</script>

  <!-- DX Tools design system — shared CSS (do not edit these files directly) -->
  <link rel="stylesheet" href="{{ '/css/fonts.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/css/tokens.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/css/frame.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/css/components.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/css/preview.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/css/code.css' | relative_url }}">

  <!-- Access Lab tool styles -->
  <link rel="stylesheet" href="{{ '/css/access-lab.css' | relative_url }}">
</head>
<body>
  <a href="#main" class="skip-link">Skip to main content</a>

  <div class="dx-doc-layout">

    <!-- ── Header ──────────────────────────────────────────────── -->
    <header class="dx-header" role="banner">
      <a href="{{ '/' | relative_url }}" class="dx-header__brand" aria-label="The Access Lab home">
        <span class="dx-header__mark" aria-hidden="true">DX</span>
        <span class="dx-header__wordmark">Access Lab</span>
      </a>

      {% include nav.html %}

      <div class="dx-header__actions">
        <button class="btn btn--ghost btn--icon" data-theme-toggle
                aria-label="Switch to light mode" aria-pressed="false">
          <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
          <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- ── Body ─────────────────────────────────────────────────── -->
    <div class="dx-doc-body dx-doc-body--no-sidebar">
      <main id="main" class="dx-main">

        {{ content }}

      </main>
    </div><!-- /dx-doc-body -->
  </div><!-- /dx-doc-layout -->

  <script src="{{ '/js/lucide.min.js' | relative_url }}"></script>
  <script src="{{ '/js/theme.js' | relative_url }}" defer></script>
  {% if page.page_js %}
  <script src="{{ '/js/' | append: page.page_js | relative_url }}" defer></script>
  {% endif %}
</body>
</html>
